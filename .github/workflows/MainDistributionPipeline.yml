#
# Haybarn build-fork: calls the HAYBARN-FORK distribution pipeline
# (Query-farm-haybarn/haybarn-extension-ci-tools, haybarn-2.0 branch) so the build
# runs in haybarn-ci images with Haybarn's R2-backed ccache, links the Haybarn
# engine (override_duckdb_repository), and deploys with the Haybarn signing key.
# duckdb_version is the Haybarn engine release tag. (.github/duckdb-version stays
# an upstream ref: the standalone test workflows check out the upstream duckdb
# submodule at it.) The engine's haybarn-extensions.yml is the canonical builder,
# so push is disabled here.
# 2.0 platforms: no wasm_mvp, osx_amd64 or windows_arm64.
#
name: Main Extension Distribution Pipeline
on:
  # push:  # Haybarn: disabled — built via core engine haybarn-extensions.yml SHA pin
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-next-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Build extension binaries
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_distribution.yml@f58e14858320a4897f31eacfb3f15096ee7cb3e7
    secrets:
      vcpkg_token: ${{ secrets.HAYBARN_VCPKG_TOKEN }}
    with:
      duckdb_version: haybarn-v2.0.0-rc6
      ci_tools_version: f58e14858320a4897f31eacfb3f15096ee7cb3e7
      extension_name: ducklake
      opt_in_archs: 'linux_arm64_musl;linux_amd64_musl'
      exclude_archs: 'wasm_mvp;osx_amd64;windows_arm64'
      override_duckdb_repository: 'https://github.com/Query-farm-haybarn/haybarn'
      override_ci_tools_repository: 'Query-farm-haybarn/haybarn-extension-ci-tools'

  # Regression test, see https://github.com/duckdb/ducklake/pull/1256 for more details.
  gcc12-compatibility-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Build with GCC 12
    runs-on: ubuntu-22.04
    env:
      VCPKG_TARGET_TRIPLET: x64-linux
      X_VCPKG_ASSET_SOURCES: 'clear;x-azurl,https://haybarn-vcpkg-cache.rusty-bb6.workers.dev/assets/,,read'
      GEN: Ninja
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      CC: gcc-12
      CXX: g++-12
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - name: Install required ubuntu packages
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq build-essential gcc-12 g++-12 cmake ninja-build ccache python3 mold

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Checkout DuckDB to version
        run: |
          cd duckdb
          git checkout $(cat ../.github/duckdb-version)

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          key: gcc12-compatibility-build
          save: ${{ github.ref == 'refs/heads/main' || github.repository != 'Query-farm-haybarn/haybarn-ducklake' }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: a42af01b72c28a8e1d7b48107b33e4f286a55ef6

      - name: Build extension
        run: |
          make release

  duckdb-next-deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Deploy extension binaries
    needs: [duckdb-next-build, gcc12-compatibility-build]
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_deploy.yml@f58e14858320a4897f31eacfb3f15096ee7cb3e7
    secrets: inherit
    with:
      extension_name: ducklake
      duckdb_version: haybarn-v2.0.0-rc6
      ci_tools_version: f58e14858320a4897f31eacfb3f15096ee7cb3e7
      override_ci_tools_repository: 'Query-farm-haybarn/haybarn-extension-ci-tools'
      opt_in_archs: 'linux_arm64_musl;linux_amd64_musl'
      exclude_archs: 'wasm_mvp;osx_amd64;windows_arm64'
      deploy_latest: ${{ github.ref == 'refs/heads/haybarn-2.0' }}
      deploy_versioned: ${{ github.ref == 'refs/heads/haybarn-2.0' }}
  relassert:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Build relassert
    runs-on: ${{ 'ubuntu-latest' }}
    env:
      GEN: ninja
      CC: clang-20
      CXX: clang++-20
      # Enable -DDEBUG slow verifiers (expression verifier, operator
      # round-trips, etc.) without changing the optimization level.
      FORCE_DEBUG: 1
      FORCE_ASSERT: 1
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=0"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
      - name: Install tools
        run: python3 duckdb/scripts/ci/retry.py -- make -C duckdb toolsci
      - name: Fix ASan runtime
        # libclang_rt.asan_static.a is missing in ubuntu 24.04 — workaround
        # mirrored from upstream Main.yml.
        run: |
          asan_static_dir="/usr/lib/llvm-20/lib/clang/20/lib/x86_64-pc-linux-gnu"
          asan_static_target="/usr/lib/llvm-20/lib/clang/20/lib/linux/libclang_rt.asan_static-x86_64.a"
          if [[ ! -e "${asan_static_dir}/libclang_rt.asan_static.a" && -e "${asan_static_target}" ]]; then
            sudo mkdir -p "${asan_static_dir}"
            sudo ln -sf "${asan_static_target}" "${asan_static_dir}/libclang_rt.asan_static.a"
          fi
      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        with:
          max-size: 5GB
          evict-old-files: job
      - name: Build (relassert → ASan + UBSan + LSan)
        uses: Query-farm-haybarn/haybarn-ci/build-duckdb@e0ad82dd40f1218f92e99adade6810c4c97b3279 # haybarn
        with:
          build-type: relassert
          build: python3 duckdb/scripts/ci/retry.py -- make relassert
          test: make unittest_relassert
          vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24