#
# Haybarn build-fork: calls the HAYBARN-FORK distribution pipeline (not upstream
# duckdb/extension-ci-tools) so the build picks up Haybarn's R2-backed ccache,
# pre-built GHCR images, and 4.13.6 toolchain. override_duckdb_repository
# points the clone at the Haybarn engine.
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  get-duckdb-version:
    name: Get DuckDB version
    runs-on: ubuntu-latest
    outputs:
      duckdb_version: ${{ steps.version.outputs.duckdb_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - id: version
        run: echo "duckdb_version=$(cat .github/duckdb-version)" >> $GITHUB_OUTPUT

  duckdb-next-build:
    name: Build extension binaries
    needs: get-duckdb-version
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_distribution.yml@e5ff1a1b5ad5d24bd833c810befc1fcb58f429d7
    secrets:
      vcpkg_token: ${{ secrets.HAYBARN_VCPKG_TOKEN }}
    with:
      duckdb_version: ${{ needs.get-duckdb-version.outputs.duckdb_version }}
      ci_tools_version: e5ff1a1b5ad5d24bd833c810befc1fcb58f429d7
      extension_name: ducklake
      override_duckdb_repository: 'https://github.com/Query-farm-haybarn/haybarn'
      override_ci_tools_repository: 'Query-farm-haybarn/haybarn-extension-ci-tools'

  duckdb-next-deploy:
    name: Deploy extension binaries
    needs: [get-duckdb-version, duckdb-next-build]
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_deploy.yml@e5ff1a1b5ad5d24bd833c810befc1fcb58f429d7
    secrets: inherit
    with:
      extension_name: ducklake
      duckdb_version: ${{ needs.get-duckdb-version.outputs.duckdb_version }}
      ci_tools_version: e5ff1a1b5ad5d24bd833c810befc1fcb58f429d7
      deploy_latest: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/haybarn' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/haybarn' }}
