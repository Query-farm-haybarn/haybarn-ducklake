#
# Haybarn build-fork: calls the HAYBARN-FORK distribution pipeline (not upstream
# duckdb/extension-ci-tools) so the build picks up Haybarn's R2-backed ccache,
# pre-built GHCR images, and 4.13.6 toolchain. override_duckdb_repository
# points the clone at the Haybarn engine; duckdb_version is the Haybarn
# engine release tag. (.github/duckdb-version stays the upstream tag: the
# standalone test workflows check out the upstream duckdb submodule at it.)
#
name: Main Extension Distribution Pipeline
on:
  # push:  # Haybarn: disabled — built via core engine haybarn-extensions.yml SHA pin
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-next-build:
    name: Build extension binaries
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_distribution.yml@caedd670666aff52b1be51d7440b0fd257df47ac
    secrets:
      vcpkg_token: ${{ secrets.HAYBARN_VCPKG_TOKEN }}
    with:
      duckdb_version: haybarn-v1.5.6-rc1
      ci_tools_version: caedd670666aff52b1be51d7440b0fd257df47ac
      extension_name: ducklake
      override_duckdb_repository: 'https://github.com/Query-farm-haybarn/haybarn'
      override_ci_tools_repository: 'Query-farm-haybarn/haybarn-extension-ci-tools'

  duckdb-next-deploy:
    name: Deploy extension binaries
    needs: duckdb-next-build
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_deploy.yml@caedd670666aff52b1be51d7440b0fd257df47ac
    secrets: inherit
    with:
      extension_name: ducklake
      duckdb_version: haybarn-v1.5.6-rc1
      ci_tools_version: caedd670666aff52b1be51d7440b0fd257df47ac
      override_ci_tools_repository: 'Query-farm-haybarn/haybarn-extension-ci-tools'
      deploy_latest: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/haybarn' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/heads/v') || github.ref == 'refs/heads/haybarn' }}
